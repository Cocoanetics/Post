name: Swift

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-macos:
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Select Xcode 27.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.1"

      - name: Verify Swift version
        run: |
          swift --version > "$RUNNER_TEMP/swift-version.txt"
          ./Scripts/check-swift-version.sh 6.4 < "$RUNNER_TEMP/swift-version.txt"

      - name: Build (debug)
        run: swift build

      - name: Build (release)
        run: swift build -c release

  build-linux:
    runs-on: ubuntu-latest
    container: swift:6.4.2-jammy

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Verify Swift version
        run: |
          swift --version > "$RUNNER_TEMP/swift-version.txt"
          ./Scripts/check-swift-version.sh 6.4 < "$RUNNER_TEMP/swift-version.txt"

      - name: Build (debug)
        run: swift build

      - name: Build (release)
        run: swift build -c release
